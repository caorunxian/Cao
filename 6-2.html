<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        .cao_title{
        display: flex;
        width: 500px;
        height: 33px;
        line-height: 33px;
        margin:50px;
        }
        .cao_title h2{
            font-size:14px;
            padding-left: 10px;
            
        }
        .cao_title a{
            font-size:12px;
            color:#ccc;
            text-decoration: none;
            margin-right:6px;

        }
        .cao_title:first-child{
            display: flex;
            justify-content: space-between;
            border: 1px solid #00f;
        }
         .cao_title:nth-child(2){
            display: flex;
            border: 1px solid #ccc;
        }
        .cao_title:nth-child(2) h2{
            flex-grow: 1;
        }
        .cao_title:nth-child(3){
            position: relative;
            border-bottom: 1px solid #ccc;
        }
        .cao_title:nth-child(3)a{
            position: absolute;
            right: 10px;
            top: 0;
        }
    </style>
</head>
<body>
    <div class="cao_title">
        <h2>曹润贤的标题</h2>
        <a href="#">更多</a>
    </div>

</html>
