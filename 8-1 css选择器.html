<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .crx_main{
            background-color: #f2f3f4;
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
        }
        .crx_box{
            width: 150px;
            height: 150px;
           border: 1px solid #ccc;
           margin: 10px;
           background-color: white;
           font-size: 14px;
           display: flex;
           align-items: center;
           justify-content: center;
           transition: all 0.6s;
           box-sizing: border-box;

        }
        .crx_box:first-child:hover{
            background-color: #000;
            color:#fff;
            font-size: 100px;
            border-width: 30px;
        }
        .crx_box:nth-child(2):hover{
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
        }
        .crx_box:nth-child(3):hover{
            text-shadow: 100px 0px 20px rgba(0,0,0,0.5);
        }
        .crx_box:nth-of-type(4):hover{
            border-radius: 50%;
        }
        .crx_box:nth-of-type(5):hover{
             background:linear-gradient(#000,#fff);
        }
        .crx_box:nth-of-type(6):hover{
            background:radial-gradient(#fff,#000);
        }
        .crx_box:nth-of-type(6)+.crx_box:hover{
            transform: scale(0.5);
        }
        .crx_box:nth-of-type(8):hover{
            transform: translateX(-100px);
        }
        .crx_box:nth-of-type(9):hover{
            transform: rotateZ(-180deg);
        }
        .crx_box:nth-of-type(10):hover{
             transform: skewX(-45deg);
        }
        .crx_box:nth-last-child(2):hover::before{
            content:"#";
            color:red;
            display: inline-block;
            margin-right: 4px;
        }
        .crx_box:last-child:hover::after{
            content:"曹润贤";
            color:#fff;
            background-color:#000;
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 30px;
            margin: 10px;
            box-sizing: border-box;
            /*扩展1：黑底白字居中圆角的我的名字,有距离*/

        }
        .crx_box:nth-of-type(3n):hover{
        border:3px solid #f00;
        }
        .crx_box:nth-child(even):hover{
            transform: translateY(-10px) scale(1.08);
            background: linear-gradient(135deg, #dfe9f3, #ffffff);
            border-color: #4a90e2;
            box-shadow: 0 12px 18px rgba(0,0,0,0.18);
            /*扩:2:鼠标在偶数个盒子上面有变化，变化效果自定义*/
        }
    </style>
</head>

<body>
    <!-- 姓名：曹润贤，日期：2026-10-22，功能名称：8-1 css选择器 -->
    <div class="crx_main">
        <div class="crx_box">1</div>
        <div class="crx_box">2</div>
        <div class="crx_box">3</div>
        <div class="crx_box">4</div>
        <div class="crx_box">5</div>
        <div class="crx_box">6</div>
        <div class="crx_box">7</div>
        <div class="crx_box">8</div>
        <div class="crx_box">9</div>
        <div class="crx_box">10</div>
        <div class="crx_box">11</div>
        <div class="crx_box">12</div>
    </div>
</body>
</html>
