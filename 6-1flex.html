<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>曹润贤 flex</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .cao_wrap {
            display: flex;
            gap: 20px;
        }

        .cao_item-box {
            width: 280px;
            height: 360px;
            border: 1px solid #999;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cao_inner-container {
            width: 80%;
            display: flex;
            gap: 12px;
        }

        .cao_gray-card {
            background: #ddd;
            border: 1px solid #222;
        }

        /* 第一个：1个方块 */
        .cao_c1 {
            justify-content: center;
        }

        .cao_c1 .cao_gray-card {
            width: 100px;
            height: 100px;
        }

        /* 第二个：上下2个 */
        .cao_c2 {
            flex-direction: column;
            align-items: center;
        }

        .cao_c2 .cao_gray-card {
            width: 140px;
            height: 90px;
        }

        /* 第三个：2行2列4个 */
        .cao_c3 {
            flex-wrap: wrap;
        }

        .cao_c3 .cao_gray-card {
            width: calc(50% - 6px);
            height: 90px;
        }

        /* 第四个：上1长，下2并排 */
        .cao_c4 {
            flex-direction: column;
        }

        .cao_top-card {
            width: 100%;
            height: 90px;
            background: #ddd;
            border: 1px solid #222;
        }

        .cao_bottom-group {
            display: flex;
            gap: 12px;
        }

        .cao_bottom-card {
            width: calc(50% - 6px);
            height: 90px;
            background: #ddd;
            border: 1px solid #222;
        }
    </style>
</head>
<body>
    <h2>曹润贤 flex</h2>

    <div class="cao_wrap">
        <!-- 第一个框 -->
        <div class="cao_item-box">
            <div class="cao_inner-container cao_c1">
                <div class="cao_gray-card"></div>
            </div>
        </div>

        <!-- 第二个框 -->
        <div class="cao_item-box">
            <div class="cao_inner-container cao_c2">
                <div class="cao_gray-card"></div>
                <div class="cao_gray-card"></div>
            </div>
        </div>

        <!-- 第三个框 -->
        <div class="cao_item-box">
            <div class="cao_inner-container cao_c3">
                <div class="cao_gray-card"></div>
                <div class="cao_gray-card"></div>
                <div class="cao_gray-card"></div>
                <div class="cao_gray-card"></div>
            </div>
        </div>

        <!-- 第四个框 -->
        <div class="cao_item-box">
            <div class="cao_inner-container cao_c4">
                <div class="cao_top-card"></div>
                <div class="cao_bottom-group">
                    <div class="cao_bottom-card"></div>
                    <div class="cao_bottom-card"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
