<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-4 环球评论</title>
    <link rel="stylesheet" href="font/iconfont.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            padding: 30px 0 0 35px;
            background-color: #fff;
            font-family: SimSun, "宋体", serif;
        }

        .crx_widget { width: 512px; margin: 0; }

        /* ===== 栏目头 ===== */
        .crx_head { display: flex; align-items: baseline; }

        .crx_title {
            font-size: 33px;
            font-weight: bold;
            color: #90080e;
        }

        .crx_sub { font-size: 20px; color: #999; margin-left: 4px; }
        .crx_sub a { color: #999; text-decoration: none; }
        .crx_sub a:hover { color: #90080e; text-decoration: underline; }
        .crx_dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #d8d8d8;
            margin: 0 6px;
            vertical-align: middle;
        }

        /* ===== 日期页签：选中框紧贴下方红线 ===== */
        .crx_tabs {
            display: flex;
            align-items: flex-end;
            width: 485px;
            margin-top: 13px;
            border-bottom: 1px solid #90080e;
        }

        .crx_tab {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            font-size: 21px;
            color: #90080e;
            cursor: pointer;
            user-select: none;
        }

        .crx_tab-on {
            width: 90px;
            height: 57px;
            padding: 0;
            font-size: 26px;
            font-weight: bold;
            background-color: #f6e5e6;
            border: 1px solid #90080e;
            border-bottom: none;
            margin-bottom: -1px;
        }

        .crx_sep { color: #90080e; font-size: 18px; padding: 0 0 16px; }

        /* ===== 头条（左侧大引号，正文整体缩进） ===== */
        .crx_featured {
            position: relative;
            margin: 26px 0 21px;
            padding-left: 36px;
        }

        .crx_quote {
            position: absolute;
            left: 0;
            top: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 40px;
            line-height: 1;
            color: #e3cdcd;
        }

        .crx_feat-link {
            display: block;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.46;
            color: #90080e;
            text-decoration: underline;
        }
        .crx_feat-link:hover { color: #b32222; }

        /* ===== 评论列表 ===== */
        .crx_list { list-style: none; }

        .crx_list li {
            position: relative;
            padding-left: 22px;
            margin-bottom: 22px;
            font-size: 24px;
            font-weight: normal;
            line-height: 1.46;
        }

        .crx_list li::before {
            content: '';
            position: absolute;
            left: 0; top: 13px;
            width: 7px; height: 7px;
            border-radius: 50%;
            background-color: #8095c0;
        }

        .crx_list a { color: #58585b; text-decoration: none; }
        .crx_list a:hover { color: #90080e; text-decoration: underline; }
    </style>
</head>
<body>
    <!-- 姓名：曹润贤，建立时间：2026-10-29，使用大模型：DeepSeek-V4.1-Flash，功能名称：16-4 环球评论（日期切换栏目） -->

    <div class="crx_widget">
        <div class="crx_head">
            <h2 class="crx_title">环球评论</h2>
            <span class="crx_sub"><span class="crx_dot"></span><a href="javascript:void(0)">社评</a><span class="crx_dot"></span><a href="javascript:void(0)">更多</a></span>
        </div>

        <div class="crx_tabs" id="crx_tabs"></div>

        <div class="crx_featured">
            <span class="crx_quote">&ldquo;</span>
            <a class="crx_feat-link" id="crx_feat" href="javascript:void(0)"></a>
        </div>

        <ul class="crx_list" id="crx_list"></ul>
    </div>

    <script>
        // ==================== 数据 ====================
        var crx_data = {
            '29日': {
                featured: '刘钊轶：南非推汽车本土化，中国制造机会来了',
                items: [
                    '樊鹏：从长征中汲取穿越风浪的力量',
                    '张健：“新北极战略”是欧盟自身焦虑的投射',
                    '王晋：以大选结果难改中东局势整体走向',
                    '刘明礼：法国抗议潮会导致欧债危机重演吗'
                ]
            },
            '28日': {
                featured: '李海东：布鲁塞尔峰会后，欧洲安全架构走向何方',
                items: [
                    '高志凯：中东变局下的中国外交定力',
                    '华黎明：沙特伊朗和解改变地区格局',
                    '崔洪建：英国“回流欧洲”还有多远',
                    '丁工：全球南方正在重塑世界秩序'
                ]
            },
            '27日': {
                featured: '张军社：美菲军事合作升级，南海局势如何破局',
                items: [
                    '王帆：大国竞争不应成为时代主旋律',
                    '金灿荣：美国国内政治极化愈演愈烈',
                    '达巍：中美关系企稳仍需相向而行',
                    '周永生：日韩关系缓和能走多远'
                ]
            },
            '26日': {
                featured: '董漫远：中东和解潮为地区发展注入新动能',
                items: [
                    '朱永彪：阿富汗重建需要国际社会合力',
                    '钮松：海湾国家经济转型初见成效',
                    '刘中民：巴以问题重回两国方案正轨',
                    '李伟建：地区国家渴望自主解决问题'
                ]
            },
            '23日': {
                featured: '苏晓晖：北约亚太化倾向值得高度警惕',
                items: [
                    '杨希雨：朝鲜半岛局势缓和窗口仍在',
                    '滕建群：美国“印太战略”难以得逞',
                    '吴心伯：对华竞争损害美国自身利益',
                    '傅梦孜：亚太合作大局不容破坏'
                ]
            },
            '22日': {
                featured: '阮宗泽：中国式现代化为世界提供新机遇',
                items: [
                    '贾秀东：全球治理呼唤中国方案',
                    '姚遥： “一带一路”十年再出发',
                    '崔洪建：欧洲对华认知正在悄然变化',
                    '高飞：多边主义是时代前行方向'
                ]
            }
        };

        var crx_tabsEl = document.getElementById('crx_tabs');
        var crx_featEl = document.getElementById('crx_feat');
        var crx_listEl = document.getElementById('crx_list');

        // ==================== 生成日期页签 ====================
        var crx_dates = Object.keys(crx_data);

        // 选中项左右不显示分隔线，与原图一致
        function crx_buildTabs(crx_active) {
            var crx_tabsHtml = '';
            crx_dates.forEach(function (crx_date, crx_i) {
                if (crx_i > 0 && crx_dates[crx_i - 1] !== crx_active && crx_date !== crx_active) {
                    crx_tabsHtml += '<span class="crx_sep">|</span>';
                }
                crx_tabsHtml += '<span class="crx_tab' + (crx_date === crx_active ? ' crx_tab-on' : '')
                    + '" data-crx-date="' + crx_date + '">' + crx_date + '</span>';
            });
            crx_tabsEl.innerHTML = crx_tabsHtml;
        }

        // ==================== 渲染内容 ====================
        function crx_render(crx_date) {
            var crx_d = crx_data[crx_date];
            crx_featEl.textContent = crx_d.featured;

            var crx_html = '';
            crx_d.items.forEach(function (crx_text) {
                crx_html += '<li><a href="javascript:void(0)">' + crx_text + '</a></li>';
            });
            crx_listEl.innerHTML = crx_html;
        }

        // ==================== 页签切换 ====================
        crx_tabsEl.addEventListener('click', function (crx_e) {
            var crx_tab = crx_e.target.closest('[data-crx-date]');
            if (!crx_tab) return;

            var crx_date = crx_tab.getAttribute('data-crx-date');
            if (crx_tab.classList.contains('crx_tab-on')) return;

            crx_buildTabs(crx_date);
            crx_render(crx_date);
        });

        // 初始渲染 29 日
        crx_buildTabs(crx_dates[0]);
        crx_render(crx_dates[0]);
    </script>
</body>
</html>
