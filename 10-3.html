<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体查询背景变化</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        .cao_viewport-box {
            width: 100vw;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background-color: #ef476f;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
        }

        @media (min-width: 600px) {
            .cao_viewport-box {
                background-color: #06d6a0;
                font-size: 3rem;
            }
        }

        @media (min-width: 900px) {
            .cao_viewport-box {
                background-color: #118ab2;
                font-size: 3.5rem;
            }
        }

        @media (min-width: 1200px) {
            .cao_viewport-box {
                background-color: #073b4c;
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <main class="cao_viewport-box">曹润贤213</main>
</body>
</html>
