<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation 幻灯片</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #eef2f3;
            color: #18323a;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .crx_slideshow {
            position: relative;
            width: min(680px, 100%);
            height: 470px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 18px 48px rgba(24, 50, 58, 0.16);
        }

        .crx_slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            animation: slide-cycle 12s infinite;
        }

        .crx_slide:nth-child(2) {
            animation-delay: 4s;
        }

        .crx_slide:nth-child(3) {
            animation-delay: 8s;
        }

        .crx_slide img {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .crx_slide p {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            min-height: 80px;
            margin: 0;
            padding: 16px;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 22px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        @keyframes slide-cycle {
            0% { opacity: 0; transform: translateY(12px); }
            4% { opacity: 1; transform: translateY(0); }
            27% { opacity: 1; transform: translateY(0); }
            33.33% { opacity: 0; transform: translateY(-12px); }
            100% { opacity: 0; transform: translateY(-12px); }
        }

        @media (max-width: 520px) {
            .crx_slideshow {
                height: min(420px, calc(100vh - 48px));
            }

            .crx_slide p {
                min-height: 72px;
                font-size: 19px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .crx_slide {
                animation: none;
            }

            .crx_slide:first-child {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <!-- 姓名：曹润贤，日期：2026-10-22，功能名称：10-2 -->
    <main class="crx_slideshow" aria-label="图片幻灯片">
        <article class="crx_slide">
            <img src="./1.png" alt="幻灯片图片一">
            <p>曹润贤213的图片一</p>
        </article>
        <article class="crx_slide">
            <img src="./2.jpg" alt="幻灯片图片二">
            <p>曹润贤213的图片二</p>
        </article>
        <article class="crx_slide">
            <img src="./3.jpg" alt="幻灯片图片三">
            <p>曹润贤213的图片三</p>
        </article>
    </main>
</body>
</html>
