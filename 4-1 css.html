<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            h2,h3,p{
                padding: 0;
                margin: 0;
            }
            #cao_box{
                width: 480px;
                padding: 8px;
                border: 1px solid #ccc;
                font-size: 12px;
                margin: 0 ;
            }
            #cao_box h3{
               font-size: 16px;
               text-align: center;
               line-height: 33px;
               letter-spacing: 3px;
               color: #036;
            }
            #cao_box p{
                line-height: 150%;
                color: #666;
                text-indent: 2em;
            }
           #cao_box a{
                color: #036;
                text-decoration: none;
                font-weight: bold; 
            }
    .cao_cname{
        color: #222;
        font-weight: bold;
    }

    .cao_student-id{
        color: blue;
        font-weight: bold;
    }

    .cao_difficulty{
        color: red;
        font-weight: bold;
    }

    .cao_knowledge-point{
        border: 1px solid purple;
        padding: 2px 4px;
    }

    </style>
        
</head>
<body>
    <h2>css进阶</h2>
    <div id="cao_box">
        <h3>css那些事</h3>
        <p>学号:<span class="cao_student-id">24001010213</span>,姓名:<span class="cao_cname">曹润贤</span>，班级:计算机24002,对于《高级网页设计》课程的难度认知为:<span class="cao_difficulty">难</span>，
            这个例子对应的知识点是：<span class="cao_knowledge-point">群组选择器、后代选择器、层叠与继承</span>。
            <a href="#">更多>></a>
        </p>
    </div>
    <!--  学号：蓝色加粗；姓名：深色加粗，难度的值：红色加粗，知识点，紫色边框，边框外为额外内容，使用内部css-->

</body>
</html>
